name: wordpress-product-site

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:?Set MYSQL_EXPORTER_USER in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-exporter-user.sh:/docker-entrypoint-initdb.d/02-create-exporter-user.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-theme/product-showcase:/var/www/html/wp-content/themes/product-showcase:ro
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 32M
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    user: "101:101"
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - frontend
      - monitoring
    depends_on:
      wordpress:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      - cadvisor
      - nginx-exporter
      - mysqld-exporter
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/nginx_status
    networks:
      - frontend
      - monitoring
    depends_on:
      nginx:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.my-cnf=/etc/mysql-exporter/.my.cnf
    volumes:
      - mysql_exporter_config:/etc/mysql-exporter:ro
    networks:
      - backend
      - monitoring
    depends_on:
      mysql:
        condition: service_healthy
      mysql-exporter-config:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  mysql-exporter-config:
    image: alpine:3.22
    restart: "no"
    environment:
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:?Set MYSQL_EXPORTER_USER in .env}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/usr/local/bin/write-exporter-config.sh"]
    volumes:
      - mysql_exporter_config:/config
      - ./mysql/write-exporter-config.sh:/usr/local/bin/write-exporter-config.sh:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  mysql_data:
  mysql_exporter_config:
  wordpress_data:
  prometheus_data:
  grafana_data:
